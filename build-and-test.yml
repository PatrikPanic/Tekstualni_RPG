name: Build i testovi

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build i unit testovi
    runs-on: windows-latest

    steps:
      - name: Dohvati kod
        uses: actions/checkout@v4

      - name: Pripremi MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Pripremi VSTest
        uses: darenm/Setup-VSTest@v1.3

      - name: Prevedi solution
        run: msbuild Tekstualni_RPG.sln /p:Configuration=Release /p:Platform=x64 /m

      # Visual Studio sprema izlaz svih projekata u zajednicku mapu
      # x64\Release u korijenu solutiona.
      - name: Pokreni unit testove
        run: vstest.console.exe x64\Release\Tests.dll /Platform:x64

      - name: Spremi izvrsnu datoteku igre
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Tekstualni_RPG
          path: |
            x64/Release/Tekstualni_RPG.exe
            armor.txt
            weapon.txt
            junk.txt
            Enemy
          if-no-files-found: warn
